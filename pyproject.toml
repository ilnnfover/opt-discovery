[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opt-discovery"
version = "0.1.0"
description = "Optimization Opportunity Discovery for vLLM-Ascend profiling data"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opt-discovery = "opt_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["opt_discovery*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
