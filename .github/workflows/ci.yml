name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: static (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Architecture/domain lint
        run: python -m tools.arch_lint --config configs/quality/arch_lint.yaml
      - name: mypy
        run: python -m mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = requires-python 的最低支持版本（本地已用 uv 独立构建复验）；
        # 3.11 = 本地第二版本；3.12 = 主要运行版本。
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      # 与本地共用 Makefile 入口，避免命令漂移
      - name: Check (ruff + mypy + validate)
        run: make check PYTHON=python
      - name: Verify (tests + synthetic demo)
        run: make verify PYTHON=python DEMO_OUT=out/demo-ci
      - name: Real regression must fail closed without data
        # 公开 runner 没有私有导出：断言退出码恰为 BLOCKED(2)。
        # 不用 `cmd || [ $? -eq 2 ]`：命令返回 0 时该写法会直接通过，漏掉假 PASS。
        run: python scripts/verify_real.py --expect-blocked
