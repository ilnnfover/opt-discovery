# Workload 描述：Qwen3.5-35B-A3B / Ascend 910B x2 / Decode / Graph
#
# 依据 $PROF_ROOT/qwen35-decode-graph-noex/workload.log（2026-11-14 核对）：
#   non-default args: dtype=bfloat16 seed=42 max_model_len=8192
#                     tensor_parallel_size=2 max_num_seqs=32
#                     enable_chunked_prefill=True enable_prefix_caching=False
#   enforce_eager=False, cudagraph_mode=FULL_AND_PIECEWISE(2), custom_ops=[]
#   PROMPT_TOKENS 1, LOAD_SECONDS 139.0
#   vLLM 0.28.1.post1.dev143+gf18cf803c
#   ACTIVE_ROUND 每轮约 1.2s
workload_id: qwen35-35b-a3b-decode-graph

model:
  name: Qwen3.5-35B-A3B
  dtype: bfloat16
  is_moe: true
  architecture: Qwen3_5MoeForConditionalGeneration

hardware:
  device: Ascend 910B
  device_count: 2
  device_profile_id: ascend_910b

execution:
  phase: decode
  mode: graph
  graph_mode: full_and_piecewise
  npugraph_ex: false

input:
  batch_size: 1
  input_length: 1
  output_length: null
  num_requests: 5
  max_num_seqs: 32
  # 图捕获尺寸（脚本里 cudagraph_capture_sizes）
  cudagraph_capture_sizes: [16, 32, 1024]
  concurrency: 1

environment:
  vllm_version: 0.28.1.post1.dev143+gf18cf803c
  vllm_ascend_commit: null
  torch_version: null
  cann_version: null

verified: true
notes:
  - 未启用 npugraph_ex（目录名 noex）
  - max_num_seqs=32，与 decode_eager 默认值不同，对比时需注意并发度差异
labels:
  stage: profiling
  tp: "2"
  collection_run_id: decode-graph
  export_dir: qwen35-decode-graph-noex
