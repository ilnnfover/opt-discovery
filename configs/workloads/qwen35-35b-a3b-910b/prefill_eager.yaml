# Workload 描述：Qwen3.5-35B-A3B / Ascend 910B x2 / Prefill / Eager
#
# 本文件的字段已按实际采集日志核对（2026-11-14）：
#   $PROF_ROOT/qwen35-prefill/workload.log
#   non-default args: dtype=bfloat16 seed=42 max_model_len=8192
#                     tensor_parallel_size=2 enforce_eager=True
#                     enable_chunked_prefill=True enable_prefix_caching=False
#                     gpu_memory_utilization=0.85
#   PROMPT_TOKENS 1024，output 1 token，active 轮数 5
#   vLLM 0.28.1.post1.dev143+gf18cf803c，VLLM_USE_V1=1
#   architecture: Qwen3_5MoeForConditionalGeneration（MoE）
#
# 注意：两个 PROF_* 目录分别是 TP0 / TP1 两个 rank，解析时应分开处理。
workload_id: qwen35-35b-a3b-prefill-eager

model:
  name: Qwen3.5-35B-A3B
  dtype: bfloat16
  is_moe: true
  architecture: Qwen3_5MoeForConditionalGeneration

hardware:
  device: Ascend 910B
  device_count: 2
  device_profile_id: ascend_910b

execution:
  phase: prefill
  mode: eager
  graph_mode: none
  npugraph_ex: false

input:
  batch_size: 1
  input_length: 1024
  output_length: 1
  num_requests: 5
  # 2026-11-15 统一补采：四组均显式设置 32
  max_num_seqs: 32
  # harness 每次 generate 只传 1 个 prompt（见 $NPU_STACK/*.py）
  concurrency: 1

environment:
  vllm_version: 0.28.1.post1.dev143+gf18cf803c
  vllm_ascend_commit: null
  torch_version: null
  cann_version: null

verified: true
notes:
  - tensor_parallel_size=2，两个 PROF 目录为两个 rank，不是同一份数据
  - enable_chunked_prefill=True, max_num_batched_tokens=8192
  - input_length 是请求级 prompt 长度，不等于算子级 Shape
labels:
  stage: profiling
  tp: "2"
  collection_run_id: prefill-eager
  export_dir: qwen35-prefill
