workload_id: qwen35-35b-a3b-prefill-graph

model:
  name: Qwen3.5-35B-A3B
  dtype: bfloat16
  is_moe: true
  architecture: Qwen3_5MoeForConditionalGeneration

hardware:
  device: Ascend 910B
  device_count: 2
  device_profile_id: ascend_910b

execution:
  phase: prefill
  mode: graph
  graph_mode: full_and_piecewise
  npugraph_ex: false

input:
  batch_size: 1
  input_length: 1024
  output_length: 1
  num_requests: 5
  # 2026-11-15 统一补采：四组均为 32
  max_num_seqs: 32
  # 图捕获尺寸（脚本里 cudagraph_capture_sizes）
  cudagraph_capture_sizes: [16, 32, 1024]
  concurrency: 1

environment:
  vllm_version: 0.28.1.post1.dev143+gf18cf803c
  vllm_ascend_commit: null
  torch_version: null
  cann_version: null

verified: true
notes:
  - 与 prefill_eager 的差异只有 enforce_eager / cudagraph_mode 与 max_num_seqs
  - 未启用 npugraph_ex（目录名 noex）
labels:
  stage: profiling
  tp: "2"
  collection_run_id: prefill-graph
  export_dir: qwen35-prefill-graph-noex
